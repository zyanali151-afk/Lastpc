name: Zyan Cloud PC (Zombie Doctor v2)
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: Create User
        run: |
          New-LocalUser -Name "zyan" -Password (ConvertTo-SecureString "Horizons123!" -AsPlainText -Force)
          Add-LocalGroupMember -Group "Administrators" -Member "zyan"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "zyan"
          Write-Host "USERNAME: zyan"
          Write-Host "PASSWORD: Horizons123!"
      - name: Speed Tune
        run: |
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualFX" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualFX" -Name VisualFXSetting -Value 2 -Force
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value "" -Force
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name TaskbarAnimations -Value 0 -Force
          Write-Host "speed tuned"
      - name: Install RustDesk Properly
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -TimeoutSec 60 https://api.github.com/repos/rustdesk/rustdesk/releases/latest
          $u = ($rel.assets | Where-Object { $_.name -like "*x86_64.exe" } | Select-Object -First 1).browser_download_url
          Write-Host "URL: $u"
          Invoke-WebRequest -TimeoutSec 240 -Uri $u -OutFile rustdesk.exe
          Write-Host "BYTES: $((Get-Item rustdesk.exe).Length)"
          $p = Start-Process .\rustdesk.exe -ArgumentList "--silent-install" -PassThru
          if (-not $p.WaitForExit(180000)) { try { $p.Kill() } catch {} }
          Start-Sleep -Seconds 10
          $exe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "SERVICE INSTALL FAILED - portable fallback"
            $exe = (Resolve-Path .\rustdesk.exe).Path
            Start-Process $exe
            Start-Sleep -Seconds 10
          }
          & $exe --password Horizons123!
          Start-Sleep -Seconds 3
          if (Get-Service RustDesk -ErrorAction SilentlyContinue) { Restart-Service RustDesk -Force; Start-Sleep -Seconds 5 }
          Start-Process $exe
          $id = ""
          for ($i = 1; $i -le 6; $i++) {
            $id = (& $exe --get-id 2>$null | Out-String).Trim()
            if ($id) { break }
            Start-Sleep -Seconds 5
          }
          Write-Host "===== CONFIG PROOF ====="
          $cfg = "$env:APPDATA\RustDesk\config\RustDesk2.toml"
          if (Test-Path $cfg) { Get-Content $cfg | Select-String -Pattern "password" } else { Write-Host "no config yet" }
          Write-Host "================================="
          Write-Host "YOUR RUSTDESK ID IS: $id"
          Write-Host "PASSWORD IS: Horizons123!"
          Write-Host "================================="
          if (-not $id) { throw "NO ID - screenshot this step" }
      - name: Zombie Doctor Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            $alive = Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue
            if (-not $alive) {
              Write-Host "[$(Get-Date)] RustDesk died! Respawning..."
              $exe = "C:\Program Files\RustDesk\rustdesk.exe"
              if (-not (Test-Path $exe)) { $exe = (Resolve-Path .\rustdesk.exe).Path }
              Start-Process $exe
              Start-Sleep -Seconds 5
            } else {
              Write-Host "[$(Get-Date)] RustDesk alive"
            }
            Start-Sleep -Seconds 120
          }
